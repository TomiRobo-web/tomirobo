<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.cover{position:relative;width:960px;height:288px;background:var(--paper);overflow:hidden}
.cover svg{position:absolute;inset:0}
.ink{fill:var(--ink)} .ai{fill:var(--ai)} .tint{fill:var(--ai-tint)} .ground{fill:var(--paper)}
.frame{fill:none;stroke:var(--paper);stroke-width:8px}
.dot{fill:var(--ink)}
.txt{position:absolute;left:40px;bottom:40px;width:420px}
.name{margin:0;color:var(--ink);font:900 80px/0.95 var(--font-display)}
.tag{margin:16px 0 0;color:var(--ink-muted);font:400 14px/1.4 var(--font-display)}
</style></head><body>
<div class="cover">
<!-- blocks: ink 240×288, ai 144×96, ai-tint 144×192 と 96×96（辺は space-4=24px の倍数、角は radius-none）
     arrangement: 右端に流れ出る、すき間のない組み合わせ。黒い枠の板と藍の板を並べる（README の「藍の扉、白い紙、黒い枠と歯車」）
     pattern: 字義どおりのモチーフ＝ロゴの四角い枠。「四角と太い枠」が原則なので、黒の板を地の色で四角く抜く。＋ ai-tint の上に space-4 ピッチの点（図面の方眼）
     scales: space-4 (24px), border-frame の2倍 (8px), radius-none -->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <rect class="ink" x="480" y="0" width="240" height="288"/>
  <rect class="frame" x="528" y="72" width="144" height="144"/>
  <rect class="ink" x="624" y="48" width="72" height="72"/>
  <rect class="ground" x="648" y="72" width="24" height="24"/>
  <rect class="tint" x="720" y="0" width="144" height="192"/>
  <rect class="ai" x="720" y="192" width="144" height="96"/>
  <rect class="tint" x="864" y="192" width="96" height="96"/>
  <rect class="ink" x="864" y="0" width="96" height="192"/>
  <g>
    <rect class="dot" x="742" y="22" width="4" height="4"/><rect class="dot" x="766" y="22" width="4" height="4"/><rect class="dot" x="790" y="22" width="4" height="4"/><rect class="dot" x="814" y="22" width="4" height="4"/><rect class="dot" x="838" y="22" width="4" height="4"/>
    <rect class="dot" x="742" y="46" width="4" height="4"/><rect class="dot" x="766" y="46" width="4" height="4"/><rect class="dot" x="790" y="46" width="4" height="4"/><rect class="dot" x="814" y="46" width="4" height="4"/><rect class="dot" x="838" y="46" width="4" height="4"/>
    <rect class="dot" x="742" y="70" width="4" height="4"/><rect class="dot" x="766" y="70" width="4" height="4"/><rect class="dot" x="790" y="70" width="4" height="4"/><rect class="dot" x="814" y="70" width="4" height="4"/><rect class="dot" x="838" y="70" width="4" height="4"/>
    <rect class="dot" x="742" y="94" width="4" height="4"/><rect class="dot" x="766" y="94" width="4" height="4"/><rect class="dot" x="790" y="94" width="4" height="4"/><rect class="dot" x="814" y="94" width="4" height="4"/><rect class="dot" x="838" y="94" width="4" height="4"/>
    <rect class="dot" x="742" y="118" width="4" height="4"/><rect class="dot" x="766" y="118" width="4" height="4"/><rect class="dot" x="790" y="118" width="4" height="4"/><rect class="dot" x="814" y="118" width="4" height="4"/><rect class="dot" x="838" y="118" width="4" height="4"/>
    <rect class="dot" x="742" y="142" width="4" height="4"/><rect class="dot" x="766" y="142" width="4" height="4"/><rect class="dot" x="790" y="142" width="4" height="4"/><rect class="dot" x="814" y="142" width="4" height="4"/><rect class="dot" x="838" y="142" width="4" height="4"/>
    <rect class="dot" x="742" y="166" width="4" height="4"/><rect class="dot" x="766" y="166" width="4" height="4"/><rect class="dot" x="790" y="166" width="4" height="4"/><rect class="dot" x="814" y="166" width="4" height="4"/><rect class="dot" x="838" y="166" width="4" height="4"/>
  </g>
</svg>
<div class="txt"><p class="name">TomiRobo</p><p class="tag">藍の扉、白い紙、黒い枠と歯車。</p></div>
</div>
</body></html>
