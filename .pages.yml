media:
  - name: pages_images
    label: 固定ページ画像
    input: public/images/pages
    output: /images/pages
    categories: [image]
  - name: news_images
    label: NEWS 画像
    input: public/images/news/uploads
    output: /images/news/uploads
    categories: [image]

content:
  - name: news
    label: NEWS（手動記事）
    type: collection
    path: src/content/news
    subfolders: false
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date, tags, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 公開日
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tags
        label: タグ
        type: string
        list: true
        required: false
      - name: author
        label: 執筆者
        type: string
        required: false
      - name: team_year
        label: 年度（任意・省略時は日付から自動計算）
        type: number
        required: false
      - name: draft
        label: 下書き（オンにすると非公開）
        type: boolean
        default: false
      - name: body
        label: 本文
        type: rich-text
        options:
          format: markdown
          media: news_images

  - name: page_home
    label: 固定ページ：HOME
    type: file
    path: src/data/pages/home.json
    format: json
    fields:
      - name: hero
        label: ヒーロー
        type: object
        fields:
          - name: label
            label: 上部ラベル
            type: string
            required: true
          - name: copyLines
            label: キャッチコピー（行ごと）
            type: string
            list: true
            required: true
          - name: lead
            label: リード文
            type: text
            required: true
          - name: primaryAction
            label: 主ボタン
            type: object
            fields:
              - name: label
                label: ボタン文言
                type: string
                required: true
              - name: href
                label: リンク先 URL
                type: string
                required: true
          - name: secondaryAction
            label: 副ボタン
            type: object
            fields:
              - name: label
                label: ボタン文言
                type: string
                required: true
              - name: href
                label: リンク先 URL
                type: string
                required: true
          - name: logo
            label: ロゴ画像
            type: object
            fields:
              - name: src
                label: 画像ファイル
                type: image
                required: true
                options:
                  media: pages_images
              - name: alt
                label: 代替テキスト（alt）
                type: string
                required: true
              - name: width
                label: 幅（px）
                type: number
                required: true
              - name: height
                label: 高さ（px）
                type: number
                required: true
      - name: newsSection
        label: 新着情報セクション
        type: object
        fields:
          - name: en
            label: 英字見出し
            type: string
            required: true
          - name: ja
            label: 日本語見出し
            type: string
            required: true
          - name: moreLabel
            label: 一覧ボタン文言
            type: string
            required: true
          - name: moreHref
            label: 一覧ボタン URL
            type: string
            required: true
      - name: teamsSection
        label: 3つの班セクション
        type: object
        fields:
          - name: en
            label: 英字見出し
            type: string
            required: true
          - name: ja
            label: 日本語見出し
            type: string
            required: true
          - name: teams
            label: 班一覧
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{ja}（{en}）'
            fields:
              - name: en
                label: 英字ラベル
                type: string
                required: true
              - name: ja
                label: 班名
                type: string
                required: true
              - name: text
                label: 説明文
                type: text
                required: true
              - name: href
                label: リンク先 URL
                type: string
                required: true
      - name: band
        label: 下部の強調帯（ご支援・お問い合わせ）
        type: object
        fields:
          - name: en
            label: 英字見出し
            type: string
            required: true
          - name: ja
            label: 日本語見出し
            type: string
            required: true
          - name: text
            label: 本文
            type: text
            required: true
          - name: actions
